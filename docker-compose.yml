version: '3.8'

services:
  localstack:
    image: localstack/localstack:1.5
    container_name: proposal-platform-localstack
    ports:
      - "4566:4566"  # Porta para todos os serviços
      - "4571:4571"  # Porta web UI (opcional)
    environment:
      - SERVICES=lambda,dynamodb,stepfunctions
      - DEFAULT_REGION=us-east-1
      - LAMBDA_EXECUTOR=docker
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - localstack_data:/var/lib/localstack

volumes:
  localstack_data:
    name: proposal-platform-localstack-data